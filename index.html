<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aplikasi Keuangan Lengkap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            padding: 30px;
        }

        h1 {
            text-align: center;
            color: #2d3748;
            margin-bottom: 30px;
        }

        .ringkasan {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .kartu {
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .kartu.saldo {
            background: linear-gradient(135deg, #2b6cb0, #3182ce);
            color: white;
        }

        .kartu.masuk {
            background: linear-gradient(135deg, #2f855a, #48bb78);
            color: white;
        }

        .kartu.keluar {
            background: linear-gradient(135deg, #c53030, #fc8181);
            color: white;
        }

        .kartu h3 {
            font-size: 16px;
            margin-bottom: 10px;
            opacity: 0.9;
        }

        .kartu .nilai {
            font-size: 24px;
            font-weight: bold;
        }

        .form-bagian {
            background: #f7fafc;
            padding: 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .form-bagian h2 {
            font-size: 18px;
            margin-bottom: 20px;
            color: #2d3748;
        }

        .form-grup {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 500;
            color: #4a5568;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            font-size: 15px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(49, 130, 206, 0.2);
        }

        .tombol-kirim {
            background-color: #3182ce;
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }

        .tombol-kirim:hover {
            background-color: #2b6cb0;
        }

        .daftar-bagian h2 {
            font-size: 18px;
            margin-bottom: 15px;
            color: #2d3748;
        }

        .tabel-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background-color: #f7fafc;
            font-weight: 600;
            color: #2d3748;
        }

        tr:hover {
            background-color: #f7fafc;
        }

        .jenis-masuk {
            color: #2f855a;
            font-weight: 500;
        }

        .jenis-keluar {
            color: #c53030;
            font-weight: 500;
        }

        .tombol-hapus {
            background-color: #fc8181;
            color: white;
            border: none;
            padding: 6px 12px;
            width: auto;
            cursor: pointer;
            border-radius: 6px;
            font-size: 13px;
        }

        .tombol-hapus:hover {
            background-color: #f56565;
        }

        .kosong {
            text-align: center;
            padding: 30px;
            color: #718096;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }
            .kartu .nilai {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Aplikasi Penghitungan Keuangan</h1>

        <!-- Bagian Ringkasan -->
        <div class="ringkasan">
            <div class="kartu saldo">
                <h3>Saldo Saat Ini</h3>
                <div class="nilai" id="saldo">Rp 0</div>
            </div>
            <div class="kartu masuk">
                <h3>Total Pemasukan</h3>
                <div class="nilai" id="totalMasuk">Rp 0</div>
            </div>
            <div class="kartu keluar">
                <h3>Total Pengeluaran</h3>
                <div class="nilai" id="totalKeluar">Rp 0</div>
            </div>
        </div>

        <!-- Form Tambah Transaksi -->
        <div class="form-bagian">
            <h2>➕ Tambah Transaksi</h2>
            <form id="formTransaksi">
                <div class="form-grup">
                    <label for="keterangan">Keterangan</label>
                    <input type="text" id="keterangan" placeholder="Contoh: Gaji bulanan, belanja harian" required>
                </div>
                <div class="form-grup">
                    <label for="jumlah">Jumlah (Rp)</label>
                    <input type="number" id="jumlah" min="1" placeholder="Masukkan angka" required>
                </div>
                <div class="form-grup">
                    <label for="jenis">Jenis Transaksi</label>
                    <select id="jenis" required>
                        <option value="masuk">Pemasukan</option>
                        <option value="keluar">Pengeluaran</option>
                    </select>
                </div>
                <div class="form-grup">
                    <label for="tanggal">Tanggal</label>
                    <input type="date" id="tanggal" required>
                </div>
                <button type="submit" class="tombol-kirim">Simpan Transaksi</button>
            </form>
        </div>

        <!-- Daftar Riwayat -->
        <div class="daftar-bagian">
            <h2>📋 Riwayat Transaksi</h2>
            <div class="tabel-wrapper">
                <table id="tabelRiwayat">
                    <thead>
                        <tr>
                            <th>Tanggal</th>
                            <th>Keterangan</th>
                            <th>Jenis</th>
                            <th>Jumlah</th>
                            <th>Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="daftarTransaksi">
                        <tr class="kosong-baris">
                            <td colspan="5" class="kosong">Belum ada transaksi</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let daftarTransaksi = [];

        // Muat data dari penyimpanan lokal
        function muatData() {
            const tersimpan = localStorage.getItem('dataKeuangan');
            if (tersimpan) {
                daftarTransaksi = JSON.parse(tersimpan);
            }
            perbaruiTampilan();
        }

        // Simpan data ke penyimpanan lokal
        function simpanData() {
            localStorage.setItem('dataKeuangan', JSON.stringify(daftarTransaksi));
        }

        // Format angka ke Rupiah
        function formatRupiah(angka) {
            return new Intl.NumberFormat('id-ID', {
                style: 'currency',
                currency: 'IDR',
                minimumFractionDigits: 0
            }).format(angka);
        }

        // Hitung ulang dan tampilkan ringkasan
        function hitungRingkasan() {
            let totalMasuk = 0;
            let totalKeluar = 0;

            daftarTransaksi.forEach(trx => {
                if (trx.jenis === 'masuk') {
                    totalMasuk += trx.jumlah;
                } else {
                    totalKeluar += trx.jumlah;
                }
            });

            const saldo = totalMasuk - totalKeluar;

            document.getElementById('saldo').textContent = formatRupiah(saldo);
            document.getElementById('totalMasuk').textContent = formatRupiah(totalMasuk);
            document.getElementById('totalKeluar').textContent = formatRupiah(totalKeluar);
        }

        // Tampilkan daftar transaksi
        function tampilkanDaftar() {
            const tbody = document.getElementById('daftarTransaksi');
            tbody.innerHTML = '';

            if (daftarTransaksi.length === 0) {
                tbody.innerHTML = `<tr class="kosong-baris"><td colspan="5" class="kosong">Belum ada transaksi</td></tr>`;
                return;
            }

            // Urutkan dari tanggal terbaru
            const urut = [...daftarTransaksi].sort((a, b) => new Date(b.tanggal) - new Date(a.tanggal));

            urut.forEach((trx, indeksAsli) => {
                const baris = document.createElement('tr');
                const indeksAsliSebelum = daftarTransaksi.indexOf(trx);
                baris.innerHTML = `
                    <td>${trx.tanggal}</td>
                    <td>${trx.keterangan}</td>
                    <td class="jenis-${trx.jenis}">${trx.jenis === 'masuk' ? 'Pemasukan' : 'Pengeluaran'}</td>
                    <td>${formatRupiah(trx.jumlah)}</td>
                    <td><button class="tombol-hapus" data-indeks="${indeksAsliSebelum}">Hapus</button></td>
                `;
                tbody.appendChild(baris);
            });

            // Tambahkan acara hapus
            document.querySelectorAll('.tombol-hapus').forEach(tombol => {
                tombol.addEventListener('click', (e) => {
                    const indeks = parseInt(e.target.dataset.indeks);
                    if (confirm('Yakin ingin menghapus transaksi ini?')) {
                        daftarTransaksi.splice(indeks, 1);
                        simpanData();
                        perbaruiTampilan();
                    }
                });
            });
        }

        function perbaruiTampilan() {
            hitungRingkasan();
            tampilkanDaftar();
        }

        // Kirim form tambah transaksi
        document.getElementById('formTransaksi').addEventListener('submit', (e) => {
            e.preventDefault();

            const keterangan = document.getElementById('keterangan').value.trim();
            const jumlah = parseInt(document.getElementById('jumlah').value);
            const jenis = document.getElementById('jenis').value;
            const tanggal = document.getElementById('tanggal').value;

            if (!keterangan || !jumlah || !tanggal) return;

            daftarTransaksi.push({
                keterangan,
                jumlah,
                jenis,
                tanggal
            });

            simpanData();
            perbaruiTampilan();

            // Kosongkan form
            document.getElementById('keterangan').value = '';
            document.getElementById('jumlah').value = '';
            document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
        });

        // Isi tanggal hari ini saat buka halaman
        document.getElementById('tanggal').valueAsDate = new Date();

        // Mulai
        muatData();
    </script>
</body>
</html>
